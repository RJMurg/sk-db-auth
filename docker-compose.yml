services:
  web:
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.CHANGEME.rule=Host(`sub.example.com`)'
      - 'traefik.http.services.CHANGEME.loadbalancer.server.port=3000'
      - 'traefik.http.routers.CHANGEME.entrypoints=websecure'
      - 'traefik.http.routers.CHANGEME.tls.certresolver=external-resolver'
      - 'external-service=true'
      - 'traefik.docker.network=traefik-external'
    build: .
    container_name: bla
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres?schema=public

      # Analytics
      PUBLIC_ENABLE_ANALYTICS: false
      PUBLIC_ANALYTICS_LINK: CHANGEME
      PUBLIC_ANALYTICS_ID: CHANGEME

      # Feature Toggles
    networks:
      - internal
      - traefik-external
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    container_name: bla-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  internal:
  traefik-external:
    external: true

volumes:
  db-data:
